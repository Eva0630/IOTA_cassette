version: '3'
services:
  compass:
    image: "iotacafe/compass:coordinator-8306ac7"
    network_mode: host
    depends_on: 
      - 'iri'
    volumes: 
      - ./state:/state
      - ./layers:/layers
    command: coordinator_deploy.jar
      ${EXTRA_COMPASS_FLAGS}
      -broadcast
      -layers /layers
      -sigMode CURLP27
      -powMode CURLP81
      -mwm ${MWM}
      -security ${SECURITY_LEVEL}
      -seed ${COMPASS_SEED}
      -tick ${TICK_RATE}
      -host http://localhost:${IRI_PORT}
      -statePath /state/statefile
    restart: always
    stop_grace_period: 60s
  iri:
    network_mode: host
    # pinned (was :latest; Docker Hub v1.8.6-RELEASE has the same amd64 digest sha256:47c34671...)
    image: "iotaledger/iri:v1.8.6-RELEASE"
    restart: always
    environment:
      - JAVA_MAX_MEMORY=1500M
      - JAVA_MIN_MEMORY=512M
    volumes: 
      - ./snapshot.txt:/snapshot.txt
      - ./db:/iri/data
    command: >-
      --testnet true
      --remote true
      --zmq-enable-tcp true
      --remote-limit-api ""
      --testnet-coordinator ZRMNUUBQHVRFRFBOQZYGAUBSTJSHDVIPXHUDA9VAXFTDSGGRILPVMYLVOLVCIEHLFMQKUOHUIUWILCXGD
      --testnet-coordinator-security-level ${SECURITY_LEVEL}
      --testnet-coordinator-signature-mode CURLP27
      --mwm ${MWM}
      --milestone-start 0
      --milestone-keys 20
      --snapshot /snapshot.txt
      --max-depth 1000 
